name: Client CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: clients-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.scope.outputs.web }}
      android: ${{ steps.scope.outputs.android }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify boundary and scope classifier
        run: |
          python3 -B scripts/check_public_boundary.py
          python3 -B -m unittest scripts.test_public_boundary scripts.test_ci_scope
      - name: Select client builds
        id: scope
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            python3 -B scripts/ci_scope.py --all --github-output "$GITHUB_OUTPUT"
          else
            git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" -- |
              python3 -B scripts/ci_scope.py --null --github-output "$GITHUB_OUTPUT"
          fi

  web:
    needs: scope
    runs-on: ubuntu-latest
    steps:
      - name: Skip unchanged Web client
        if: needs.scope.outputs.web != 'true'
        run: echo "No Web changes; heavy Web validation skipped."
      - if: needs.scope.outputs.web == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: needs.scope.outputs.web == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
      - if: needs.scope.outputs.web == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - if: needs.scope.outputs.web == 'true'
        run: npm ci
      - if: needs.scope.outputs.web == 'true'
        run: npm run check:web
      - if: needs.scope.outputs.web == 'true'
        run: npm run package:web
      - if: needs.scope.outputs.web == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xuanxue-web-${{ github.sha }}
          path: dist/web/xuanxue-web.tar.gz
          if-no-files-found: error
          retention-days: 30

  android:
    needs: scope
    runs-on: ubuntu-latest
    steps:
      - name: Skip unchanged Android client
        if: needs.scope.outputs.android != 'true'
        run: echo "No Android changes; heavy Android validation skipped."
      - if: needs.scope.outputs.android == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: needs.scope.outputs.android == 'true'
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - if: needs.scope.outputs.android == 'true'
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - if: needs.scope.outputs.android == 'true'
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - if: needs.scope.outputs.android == 'true'
        run: ./gradlew :app:assembleDebug
        working-directory: android
